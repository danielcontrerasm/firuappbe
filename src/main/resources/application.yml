spring:
  application:
    name: pettracker
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      continue-on-error: ${SPRING_SQL_INIT_CONTINUE_ON_ERROR:true}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pettracker}
    username: ${SPRING_DATASOURCE_USERNAME:petuser}
    password: ${SPRING_DATASOURCE_PASSWORD:petpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:20000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

pettracker:
  security:
    default-jwt-secret: pettracker-local-development-secret-change-this-before-production-0123456789
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://firuappfe-production.up.railway.app,https://api.firuapp.com.co}

jwt:
  # Local development fallback only. Railway deployments must set JWT_SECRET explicitly.
  secret: ${JWT_SECRET:${pettracker.security.default-jwt-secret}}
  expiration: ${JWT_EXPIRATION_MS:86400000}

demo:
  gps:
    enabled: false
    outside-interval-ms: 300000

geocoding:
  nominatim:
    enabled: ${GEOCODING_NOMINATIM_ENABLED:true}
    base-url: ${GEOCODING_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_NOMINATIM_USER_AGENT:pettracker/1.0}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  whatsapp-enabled: ${TWILIO_WHATSAPP_ENABLED:false}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:}

notifications:
  email:
    from: ${NOTIFICATIONS_EMAIL_FROM:}

gps:
  listener:
    port: 5000
  ingestion:
    core-threads: ${GPS_INGESTION_CORE_THREADS:2}
    max-threads: ${GPS_INGESTION_MAX_THREADS:4}
    queue-capacity: ${GPS_INGESTION_QUEUE_CAPACITY:500}

logging:
  level:
    com.example.pettracker.gps.protocol.v41.V41ProtocolDecoder: DEBUG

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
